============================================================
TRANSACTION SAFETY
============================================================

Invitation acceptance must be atomic.

Prevent race conditions such as:

two requests accepting the same invitation simultaneously.

Only one request may successfully consume the invitation.

Use:

database transaction
row locking / appropriate concurrency control
or another correct mechanism.

Do not rely only on frontend disabling the button.

