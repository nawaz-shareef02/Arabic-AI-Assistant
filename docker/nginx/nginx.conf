============================================================
SECURITY REQUIREMENTS
============================================================

Invitation tokens must be:

- cryptographically random
- sufficiently long
- single-use
- hashed at rest
- time-limited
- invalidated after acceptance
- invalidated after cancellation
- invalidated after expiry
- impossible to derive from invitation ID
- impossible to predict

Never store the raw invitation token in PostgreSQL.

Never log the raw token.

Never expose the token through backend logs.

============================================================
TENANT ISOLATION
============================================================

An invitation belongs to exactly one organization.

Verify:

Organization A admin cannot create an invitation for Organization B.

Organization A admin cannot modify Organization B invitations.

Organization A invitation cannot create Organization B membership.

Invitation acceptance must use the organization associated with the
stored invitation.

Do NOT trust organization_id supplied by the frontend.

Resolve organization from the authenticated inviter's membership.

============================================================
