# ==============================================================================
# ArabIQ Reverse Proxy — Server Configuration
# ==============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Maximum file upload size (50MB matches StorageService MAX_FILE_SIZE)
    client_max_body_size 50M;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --------------------------------------------------------------------------
    # 1. Health & Liveness Probes
    # --------------------------------------------------------------------------
    location ~ ^/(health|ready|live)$ {
        proxy_pass http://backend_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. Streaming Chat Endpoint (SSE / Chunked Transfer)
    # --------------------------------------------------------------------------
    location /api/v1/chat/stream {
        limit_req zone=stream_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;

        # CRITICAL: Disable buffering for real-time LLM token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        # Extended timeouts for long-running LLM generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # 3. General Backend API Endpoints
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_upstream;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4. Frontend Application (Next.js)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;

        # WebSocket support for Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
