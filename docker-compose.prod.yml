# ==============================================================================
# ArabIQ — Enterprise Production Stack (Docker Compose)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database (Private Internal Service)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: arabiq-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arabiq_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided via environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arabiq_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ----------------------------------------------------------------------------
  # 2. Redis Broker & Cache (Private Internal Service)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: arabiq-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ----------------------------------------------------------------------------
  # 3. Qdrant Vector Database (Private Internal Service)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: arabiq-qdrant-prod
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ----------------------------------------------------------------------------
  # 4. FastAPI Backend (Application Server)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arabiq-backend-prod
    restart: unless-stopped
    environment:
      PROJECT_NAME: "ArabIQ"
      API_V1_STR: "/api/v1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arabiq_platform}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided in production}
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "60"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "arabiq_documents"
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_DEVICE: "cpu"
      EMBEDDING_BATCH_SIZE: "32"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_PROVIDER: "ollama"
      LLM_MODEL: "qwen3:8b"
      LLM_TIMEOUT: "180"
      LLM_TEMPERATURE: "0.1"
      LLM_MAX_TOKENS: "400"
      UPLOAD_DIR: "/app/uploads"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost", "http://127.0.0.1"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost", "127.0.0.1", "backend", "reverse-proxy"]}
      RUN_MIGRATIONS: "true"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    networks:
      - internal_net
      - frontend_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ----------------------------------------------------------------------------
  # 5. Celery Asynchronous Background Worker
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arabiq-celery-worker-prod
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "celery"]
    environment:
      PROJECT_NAME: "ArabIQ"
      API_V1_STR: "/api/v1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arabiq_platform}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided in production}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "arabiq_documents"
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_DEVICE: "cpu"
      EMBEDDING_BATCH_SIZE: "32"
      UPLOAD_DIR: "/app/uploads"
      RUN_MIGRATIONS: "false"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal_net
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ----------------------------------------------------------------------------
  # 6. Next.js Frontend Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: arabiq-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ----------------------------------------------------------------------------
  # 7. Nginx Edge Reverse Proxy (Public Ingress)
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: arabiq-reverse-proxy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

# ------------------------------------------------------------------------------
# Network Topology
# ------------------------------------------------------------------------------
networks:
  # Internal network: isolated data tier (postgres, redis, qdrant, celery, backend)
  internal_net:
    driver: bridge
    internal: true

  # Frontend network: edge ingress (reverse-proxy, frontend, backend API)
  frontend_net:
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volume Storage
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
