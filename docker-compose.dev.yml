# ==============================================================================
# ArabIQ — Local Development Stack (Docker Compose)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: arabiq-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: arabiq_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arabiq_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arabiq-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: arabiq-qdrant-dev
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arabiq-backend-dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "ArabIQ"
      API_V1_STR: "/api/v1"
      DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/arabiq_platform"
      SECRET_KEY: "dev-insecure-secret-key-do-not-use-in-production-0000000000000000"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "arabiq_documents"
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_DEVICE: "cpu"
      OLLAMA_URL: "http://host.docker.internal:11434"
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      ALLOWED_HOSTS: '["localhost", "127.0.0.1", "backend", "testserver"]'
      RUN_MIGRATIONS: "true"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arabiq-celery-dev
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=debug", "--concurrency=1", "-Q", "celery"]
    environment:
      DATABASE_URL: "postgresql://postgres:devpassword@postgres:5432/arabiq_platform"
      SECRET_KEY: "dev-insecure-secret-key-do-not-use-in-production-0000000000000000"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: arabiq-frontend-dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
  qdrant_dev_data:
